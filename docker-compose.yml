services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "${TPC_OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 20s
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${TPC_OLLAMA_MODEL:-qwen2.5:7b-instruct}
    volumes:
      - ./scripts/ollama-pull.sh:/ollama-pull.sh:ro
    entrypoint: ["/bin/bash", "/ollama-pull.sh"]
    restart: "no"

  app:
    build:
      context: .
      args:
        TG_AUTH_TOKEN: ${TG_AUTH_TOKEN:-}
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    ports:
      - "${TPC_HOST_PORT:-3000}:3000"
    environment:
      TPC_OLLAMA_BASE_URL: http://ollama:11434
      TPC_OLLAMA_MODEL: ${TPC_OLLAMA_MODEL:-qwen2.5:7b-instruct}
      TPC_IN_CONTAINER: "1"
    volumes:
      - tpc-data:/data
    restart: unless-stopped

volumes:
  tpc-data:
  ollama-data:
